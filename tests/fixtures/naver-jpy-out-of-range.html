<!doctype html>
<html lang="ko">
  <head>
    <title>일본 JPY : 네이버 금융</title>
  </head>
  <body>
    <!--
      파싱은 성공하지만 값이 비상식적인 경우 (예: 소수점이 유실되어 88897 로 읽힘).
      유효성 범위 검사에서 거부되어 저장/전송되지 않아야 한다.
    -->
    <div class="today">
      <p class="no_today">
        <em class="no_down">
          <span class="no8">8</span><span class="no8">8</span><span class="no8">8</span
          ><span class="no9">9</span><span class="no7">7</span>
        </em>
        <span class="txt_won">원</span>
      </p>
    </div>
  </body>
</html>
