<!doctype html>
<html lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=euc-kr" />
    <title>일본 JPY : 네이버 금융</title>
  </head>
  <body>
    <!--
      digit span 이 제거되고 접근성용 .blind 텍스트만 남은 레이아웃 변형.
      no_today_text 파서가 먼저 잡아내는지, 아니면 blind_text 로 넘어가는지 검증한다.
    -->
    <div class="head_info">
      <p class="no_today">
        <span class="blind">932.15</span>
        <span class="sprite_num" aria-hidden="true"></span>
      </p>
    </div>
  </body>
</html>
